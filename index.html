<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PUZZLE BATTALION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ TOP BAR : status / base HP / room ============ -->
  <header id="topbar">
    <div class="base-readout mine">
      <span class="side-tag">NHÀ CHÍNH BẠN</span>
      <div class="hpbar"><div id="hpMine" class="hpfill"></div></div>
      <span id="hpMineNum" class="hpnum">1000</span>
    </div>

    <div class="room-widget">
      <div id="connState" class="conn-dot offline" title="Trạng thái kết nối"></div>
      <input id="roomInput" maxlength="4" inputmode="numeric" placeholder="MÃ PHÒNG">
      <button id="btnHost" class="btn-tac">TẠO PHÒNG</button>
      <button id="btnJoin" class="btn-tac">VÀO PHÒNG</button>
      <span id="roomLabel" class="room-label"></span>
    </div>

    <div class="base-readout theirs">
      <span class="side-tag">NHÀ CHÍNH ĐỊCH</span>
      <div class="hpbar"><div id="hpEnemy" class="hpfill enemy"></div></div>
      <span id="hpEnemyNum" class="hpnum">1000</span>
    </div>
  </header>

  <!-- ============ BULLET CHAT STRIP ============ -->
  <div id="danmakuLayer" aria-hidden="true"></div>

  <!-- ============ BATTLEFIELD (upper half) ============ -->
  <section id="battlefieldWrap">
    <canvas id="battlefield" width="1000" height="260"></canvas>
    <div id="gameOverBanner" class="hidden"></div>
  </section>

  <!-- ============ MEDIA + CHAT DOCK ============ -->
  <section id="mediaDock">
    <div class="video-slot">
      <video id="localVideo" autoplay muted playsinline></video>
      <span class="video-tag">BẠN</span>
    </div>
    <div class="video-slot">
      <video id="remoteVideo" autoplay playsinline></video>
      <span class="video-tag">ĐỊCH</span>
    </div>
    <div class="media-controls">
      <button id="btnMic" class="btn-tac small" data-on="1">MIC: BẬT</button>
      <button id="btnCam" class="btn-tac small" data-on="1">CAM: BẬT</button>
    </div>
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="60" placeholder="Nhắn gì đó chạy ngang màn hình..." autocomplete="off">
      <button type="submit" class="btn-tac small">GỬI</button>
    </form>
  </section>

  <!-- ============ PUZZLE GRID (lower half) ============ -->
  <section id="puzzleWrap">
    <div class="puzzle-side-panel">
      <div class="panel-block">
        <span class="panel-label">TIẾP THEO</span>
        <canvas id="nextPiece" width="88" height="88"></canvas>
      </div>
      <div class="panel-block">
        <span class="panel-label">HÀNG ĐÃ NỔ</span>
        <span id="rowsCleared" class="panel-value">0</span>
      </div>
      <div class="panel-block legend">
        <span class="panel-label">CHÚ GIẢI</span>
        <div class="legend-row"><i class="dot red"></i> Kiếm sĩ — cận chiến, máu cao</div>
        <div class="legend-row"><i class="dot blue"></i> Cung thủ — tầm xa, sát thương cao</div>
      </div>
      <button id="btnPause" class="btn-tac small">TẠM DỪNG</button>
    </div>
    <canvas id="puzzleGrid" width="240" height="300"></canvas>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="game.js"></script>
<script src="net.js"></script>
</body>
</html>
